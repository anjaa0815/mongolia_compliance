[project]
name = "mongolia_compliance"
authors = [
    { name = "Anjaa", email = "anjaaariunjargal@gmail.com" }
]
description = "Mongolian localization for ERPNext: chart of accounts, VAT, E-Barimt, reports and translations"
requires-python = ">=3.14"
readme = "README.md"
license = { text = "GPL-3.0-only" }
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=17.0.0-dev,<18.0.0"
erpnext = ">=17.0.0-dev,<18.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = ["E501", "W191", "RUF001", "RUF002", "RUF003", "F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
